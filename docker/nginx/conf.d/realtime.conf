server {
    listen 80;
    server_name dev.realtime.social.aleherse.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.realtime.social.aleherse.com;

    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/cert-key.pem;

    # Browsers subscribe over the websocket; only the API publishes, directly to the realtime container.
    location = /event/realtime {
        proxy_pass http://realtime:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
