server {
    listen 80;
    server_name dev.app.social.aleherse.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.app.social.aleherse.com;

    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/cert-key.pem;

    root /app/apps/web/dist;
    index index.html;

    # ADR-0022: the map archive, read with range requests; a missing file is a
    # 404 rather than the SPA's index.html.
    location /tiles/ {
        alias /app/var/map/tiles/;
    }

    location / {
        try_files $uri /index.html;
    }
}
