server {
    listen 80;
    server_name dev.doc.social.aleherse.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.doc.social.aleherse.com;

    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/cert-key.pem;

    # Rendered by `make docs-build`: the landing page at /, Scalar at /api/, AsyncAPI at /event/.
    root /app/apps/docs/dist;
    index index.html;

    # `/api` redirects to `/api/`; a relative redirect keeps the published port the browser used.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
