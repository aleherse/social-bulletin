services:
  php:
    build:
      context: docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    environment:
      XDEBUG_REMOTE_HOST: ${XDEBUG_REMOTE_HOST:-host.docker.internal}
      XDEBUG_REMOTE_PORT: ${XDEBUG_REMOTE_PORT:-9003}
      XDEBUG_DIR: ${XDEBUG_DIR:-/app/var/xdebug}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bulletin:bulletin@postgres:5432/bulletin?serverVersion=17&charset=utf8}
      # Plain URL for DSLR (it cannot parse Doctrine's query parameters).
      DSLR_DATABASE_URL: ${DSLR_DATABASE_URL:-postgresql://bulletin:bulletin@postgres:5432/bulletin}
    volumes:
      - .:/app
      - composer-cache:/var/cache/composer
    depends_on:
      postgres:
        condition: service_healthy
    # nginx proxies to php-fpm, so it waits for the pool to accept connections
    # rather than for the container to start.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 30
    extra_hosts:
      - host.docker.internal:host-gateway

  node:
    build:
      context: docker/node
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    environment:
      DSLR_DATABASE_URL: ${DSLR_DATABASE_URL:-postgresql://bulletin:bulletin@postgres:5432/bulletin}
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
    volumes:
      - .:/app
      - ./docker/certs:/certs:ro
      - npm-cache:/var/cache/npm
    ipc: host
    depends_on:
      # E2E runs trust the CA nginx generates, so they wait until it exists.
      nginx:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    build: docker/nginx
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/app:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certs:/certs
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /certs/cert.pem && test -s /certs/rootCA.pem && kill -0 $$(cat /run/nginx.pid)"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      default:
        # Lets other containers (e.g. E2E runs in the node container) reach the dev hostnames.
        aliases:
          - dev.api.social.aleherse.com
          - dev.app.social.aleherse.com

  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_DB: bulletin
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin
    volumes:
      - social-bulletin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin -d bulletin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  social-bulletin-data:
  composer-cache:
  npm-cache:
