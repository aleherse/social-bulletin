security:
    providers:
        app_users:
            id: App\Security\ApiUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        public:
            pattern: ^/api/(session|logout|doc\.json)$
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~

    access_control:
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
