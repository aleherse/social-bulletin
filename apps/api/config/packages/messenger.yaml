# ADR-0017: Symfony Messenger owns the command bus.
# ADR-0020: a second bus carries the queries.
# No transports on either: both are handled synchronously in the request that dispatched them,
# so the handler's result is still available to the controller.
framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus: ~
            query.bus: ~
