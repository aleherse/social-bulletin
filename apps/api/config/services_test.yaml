# Behat contexts are wired as autowired services in the test container
# (friends-of-behat/symfony-extension resolves them from here).
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\Support\:
        resource: '../tests/Support/*'

    # Records what the domain publishes, and whether it was already stored.
    App\Tests\Support\RecordingEventDispatcher:
        decorates: SocialBulletin\Core\Domain\Helper\EventDispatcher

    # Stands in for the network: records what the app would send to AppSync Events.
    App\Tests\Support\RecordingHttpClient:
        decorates: http_client
