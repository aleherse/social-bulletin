# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # makes every packages/core `*Repository` class available as a service:
    SocialBulletin\Core\Domain\:
        resource: '../../../packages/core/src/Domain/*/*Repository.php'

    # packages/core read providers: the SQL behind the query side.
    SocialBulletin\Core\Application\:
        resource: '../../../packages/core/src/Application/*/Provider/*Provider.php'

    # packages/core command handlers: tagged here
    SocialBulletin\Core\Application\CommandHandlers:
        namespace: SocialBulletin\Core\Application\
        resource: '../../../packages/core/src/Application/*/Command/*Handler.php'
        tags:
            - name: messenger.message_handler
              bus: command.bus

    # packages/core query handlers: the same arrangement on the query bus
    SocialBulletin\Core\Application\QueryHandlers:
        namespace: SocialBulletin\Core\Application\
        resource: '../../../packages/core/src/Application/*/Query/*Handler.php'
        tags:
            - name: messenger.message_handler
              bus: query.bus

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Shared HTTP machinery for the Behat contexts (ADR-0015).
        App\Tests\Behat\ApiClient: ~
