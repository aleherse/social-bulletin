# ADR-0012: Deptrac owns package and layer dependency rules.
# packages/core stays framework-free but owns its DBAL repositories; apps depend on packages, never the reverse.
# ADR-0021: inside packages/core, Application may use Domain; Domain never reaches back into Application.
# Framework reaches core through Application only, plus the domain errors it maps to status codes (DomainError).
# Providers read; they never touch a repository (ADR-0021), and nothing in apps/api injects one either.
# domain-helpers-0002: Domain/Helper interfaces are ports apps/api implements, so they form their own DomainPort layer.
deptrac:
  paths:
    - apps/api/src
    - packages/core/src

  layers:
    - name: Framework
      collectors:
        - type: directory
          value: apps/api/src/.*

    - name: Provider
      collectors:
        - type: directory
          value: packages/core/src/Application/.*/Provider/.*

    - name: Application
      collectors:
        - type: bool
          must:
            - type: directory
              value: packages/core/src/Application/.*
          must_not:
            - type: layer
              value: Provider

    - name: DomainError
      collectors:
        - type: implements
          value: 'SocialBulletin\Core\Domain\Helper\DomainError'
        - type: classNameRegex
          value: '/^SocialBulletin\\Core\\Domain\\Helper\\DomainError$/'

    - name: DomainPort
      collectors:
        - type: bool
          must:
            - type: directory
              value: packages/core/src/Domain/Helper/.*
            - type: interface
              value: '.*'
          must_not:
            - type: layer
              value: DomainError

    - name: Repository
      collectors:
        - type: classNameRegex
          value: '/^SocialBulletin\\Core\\Domain\\\w+\\\w*Repository$/'

    - name: Domain
      collectors:
        - type: bool
          must:
            - type: directory
              value: packages/core/src/Domain/.*
          must_not:
            - type: layer
              value: DomainError
            - type: layer
              value: DomainPort
            - type: layer
              value: Repository

    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\(?!Contracts|Component\\Uid)/'

    - name: SymfonyContracts
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Contracts/'

    - name: SymfonyUid
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Component\\Uid/'

    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\(?!DBAL)/'

    - name: DBAL
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\DBAL/'

    - name: Psr
      collectors:
        - type: classNameRegex
          value: '/^Psr/'

    - name: Assert
      collectors:
        - type: classNameRegex
          value: '/^Webmozart/'

  ruleset:
    Framework: [Application, DomainError, DomainPort, Symfony, SymfonyContracts, SymfonyUid, Doctrine, Psr, Assert]
    Application: [Provider, Domain, DomainError, DomainPort, Repository, SymfonyContracts, SymfonyUid, Psr, Assert]
    Provider: [Application, Domain, DomainError, SymfonyContracts, SymfonyUid, DBAL, Psr, Assert]
    Repository: [Domain, DomainError, DomainPort, SymfonyContracts, SymfonyUid, DBAL, Psr, Assert]
    Domain: [DomainError, DomainPort, SymfonyContracts, SymfonyUid, Psr, Assert]
    DomainError: [Domain, SymfonyContracts, SymfonyUid, Psr, Assert]
    DomainPort: [Domain, DomainError, SymfonyContracts, SymfonyUid, Psr, Assert]
