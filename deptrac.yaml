# ADR-0012: Deptrac owns package and layer dependency rules.
# packages/core stays framework-free but owns its DBAL repositories; apps depend on packages, never the reverse.
# ADR-0017: inside packages/core, Application may use Domain; Domain never reaches back into Application.
deptrac:
  paths:
    - apps/api/src
    - packages/core/src

  layers:
    - name: Framework
      collectors:
        - type: directory
          value: apps/api/src/.*

    - name: Application
      collectors:
        - type: directory
          value: packages/core/src/Application/.*

    - name: Domain
      collectors:
        - type: directory
          value: packages/core/src/Domain/.*

    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\(?!Contracts|Component\\Uid)/'

    - name: SymfonyContracts
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Contracts/'

    - name: SymfonyUid
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Component\\Uid/'

    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\(?!DBAL)/'

    - name: DBAL
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\DBAL/'

    - name: Psr
      collectors:
        - type: classNameRegex
          value: '/^Psr/'

    - name: Assert
      collectors:
        - type: classNameRegex
          value: '/^Webmozart/'

  ruleset:
    Framework: [Application, Domain, Symfony, SymfonyContracts, SymfonyUid, Doctrine, DBAL, Psr, Assert]
    Application: [Domain, SymfonyContracts, SymfonyUid, DBAL, Psr, Assert]
    Domain: [SymfonyContracts, SymfonyUid, DBAL, Psr, Assert]
