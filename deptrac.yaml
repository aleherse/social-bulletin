# ADR-0012: Deptrac owns package and layer dependency rules.
# packages/core stays framework-free but owns its DBAL repositories; apps depend on packages, never the reverse.
deptrac:
  paths:
    - apps/api/src
    - packages/core/src

  layers:
    - name: App
      collectors:
        - type: directory
          value: apps/api/src/.*

    - name: Core
      collectors:
        - type: directory
          value: packages/core/src/.*

    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\(?!Contracts|Component\\Uid)/'

    - name: SymfonyContracts
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Contracts/'

    - name: SymfonyUid
      collectors:
        - type: classNameRegex
          value: '/^Symfony\\Component\\Uid/'

    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\(?!DBAL)/'

    - name: DBAL
      collectors:
        - type: classNameRegex
          value: '/^Doctrine\\DBAL/'

    - name: Psr
      collectors:
        - type: classNameRegex
          value: '/^Psr/'

    - name: Assert
      collectors:
        - type: classNameRegex
          value: '/^Webmozart/'

  ruleset:
    App: [Core, Symfony, SymfonyContracts, SymfonyUid, Doctrine, DBAL, Psr, Assert]
    Core: [SymfonyContracts, SymfonyUid, DBAL, Psr, Assert]
