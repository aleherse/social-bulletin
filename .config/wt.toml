# Worktrunk project config — https://worktrunk.dev

[pre-start]
compose-env = """
cat > .env <<'ENV'
COMPOSE_PROJECT_NAME=social-bulletin-{{ branch | sanitize }}
NODE_PORT={{ ('node-' ~ branch) | hash_port }}
NGINX_HTTP_PORT={{ ('http-' ~ branch) | hash_port }}
NGINX_HTTPS_PORT={{ ('https-' ~ branch) | hash_port }}
POSTGRES_PORT={{ ('postgres-' ~ branch) | hash_port }}
ENV
"""
copy = "wt step copy-ignored --require-include"
init = "make init"

[pre-remove]
compose-down = "make down"

[list]
url = "https://dev.app.social.aleherse.com:{{ ('node-' ~ branch) | hash_port }}"
